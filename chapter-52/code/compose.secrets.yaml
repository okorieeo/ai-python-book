# compose.secrets.yaml (optional overlay): read the Django secret key from a FILE.
# Add it to COMPOSE_FILE:  COMPOSE_FILE=compose.yaml:compose.prod.yaml:compose.secrets.yaml
# The app (Chapter 17) reads DJANGO_SECRET_KEY_FILE in preference to DJANGO_SECRET_KEY.
x-django-secret: &django-secret
  secrets:
    - django_secret_key
  environment:
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key

services:
  migrate:
    <<: *django-secret
  backend:
    <<: *django-secret
  channels-worker:
    <<: *django-secret
  celery-worker:
    <<: *django-secret
  celery-beat:
    <<: *django-secret

secrets:
  django_secret_key:
    file: ./secrets/django_secret_key
