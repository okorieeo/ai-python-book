# compose.yaml: the shared base. Every service, no published ports.
# Overlays are chosen in .env (COMPOSE_FILE): compose.dev.yaml or compose.prod.yaml.
name: ai-chat

# ---- Shared settings for every service that runs the Django image ----
x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:-ai-chat-backend}:${APP_VERSION:-dev}
  environment:
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    DATABASE_URL: "postgres://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:?Set it in .env}\
      @db:5432/${POSTGRES_DB:-chat}"
    REDIS_URL: redis://redis:6379/0
    TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
  volumes:
    - media:/app/media

services:
  # ------------------------------------------------------------ data stores
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # $$ stops Compose from expanding the variables; the container's shell does.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------ Django family
  # One-shot job: apply migrations, then exit. Everything else waits for it.
  migrate:
    <<: *backend-common
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend-common
    build:
      context: ./backend
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional: only for projects whose Chapter 14 design uses background channel
  # consumers. Start it with: docker compose --profile channels up -d
  channels-worker:
    <<: *backend-common
    profiles: ["channels"]
    command: python manage.py runworker ${CHANNEL_NAMES:-background-tasks}
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-worker:
    <<: *backend-common
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Exactly ONE Beat. Two copies would run every scheduled task twice.
  celery-beat:
    <<: *backend-common
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ------------------------------------------------------------ Next.js
  frontend:
    image: ${FRONTEND_IMAGE:-ai-chat-frontend}:${APP_VERSION:-dev}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL in .env}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
