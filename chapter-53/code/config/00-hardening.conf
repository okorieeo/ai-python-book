# /etc/ssh/sshd_config.d/00-hardening.conf   (Chapter 53)
#
# The "00-" prefix matters: sshd reads files in sshd_config.d in alphabetical order and the FIRST
# value it sees for a setting wins. cloud-init may write 50-cloud-init.conf, which would silently
# beat a file named 99-something.conf.
#
# Prove what is really in effect with:   sudo sshd -T | grep -E 'passwordauth|permitroot|pubkey'

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
ClientAliveInterval 300
ClientAliveCountMax 2

# Optional: only these users may log in over SSH. Uncomment AFTER you have tested your login.
# AllowUsers deploy
