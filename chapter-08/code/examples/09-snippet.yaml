openapi: 3.0.3
info:
  title: AI Chat Assistant API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000/api/v1
security:
  - bearerAuth: []
paths:
  /conversations:
    get:
      summary: List my conversations (newest activity first)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: A page of conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Start a conversation
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Error" }
  /conversations/{conversation_id}/messages:
    parameters:
      - in: path
        name: conversation_id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Message history, newest first (cursor pagination)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: A page of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  next_cursor: { type: string, nullable: true }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Send a message
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "422": { $ref: "#/components/responses/Error" }
        "429":
          description: Plan limit reached
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      properties:
        id: { type: integer }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        input_tokens: { type: integer, nullable: true }
        output_tokens: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            request_id: { type: string }
  responses:
    Error:
      description: An error in the standard format
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
