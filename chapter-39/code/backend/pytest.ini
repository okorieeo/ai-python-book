[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = .
python_files = test_*.py
testpaths = tests tests_django
addopts = -ra -q --strict-markers --reuse-db
markers =
    slow: takes more than a second; excluded from the quick local run with -m "not slow"
    live: calls a real external service; never runs in CI by default
