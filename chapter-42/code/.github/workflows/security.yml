name: Security audit

# Vulnerabilities are discovered without any change to our code, so they must not make unrelated pull
# requests fail. This runs on a schedule instead, and a failure here is a task for the team, not a broken build.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  python:
    name: Python packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt --progress-spinner off

  node:
    name: Node packages (${{ matrix.area }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        area: [web, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.area }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ matrix.area }}/.nvmrc
      - run: npm audit --omit=dev --audit-level=high
