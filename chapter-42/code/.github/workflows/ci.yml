name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs can read the code and nothing else, unless a job asks for more.
permissions:
  contents: read

# A new push to the same pull request cancels the older run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      web: ${{ steps.areas.outputs.web }}
      mobile: ${{ steps.areas.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and its first parent: enough to see what the pull request changes
          persist-credentials: false
      - name: Test the CI scripts themselves
        run: python3 ci/test_ci_scripts.py
      - name: Decide which areas to check
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only -z HEAD^1 HEAD | python3 ci/changed_areas.py >> "$GITHUB_OUTPUT"
          else
            python3 ci/changed_areas.py --all >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  workflows:
    name: Workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned and checksummed)
        run: ci/install_actionlint.sh "$RUNNER_TEMP/bin"
      - name: Lint the workflow files
        run: '"$RUNNER_TEMP/bin/actionlint" -color'

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci # a throwaway database that exists for this run only
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: System packages (ffmpeg is used by the attachment tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy .
      - name: Every model change has a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Tests with coverage
        run: |
          coverage run manage.py test
          coverage report
          coverage xml
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Format check
        run: npx prettier --check .
      - name: Lint (Next.js 16 removed "next lint", so run ESLint itself)
        run: npx eslint . --max-warnings=0
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test --if-present
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.test # a placeholder: the build must not need real secrets
        run: npm run build

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Format check
        run: npx prettier --check .
      - name: Lint
        run: npx eslint . --max-warnings=0
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test

  # The ONE check that branch protection requires. It always runs, even when jobs above were skipped on purpose.
  ci-ok:
    name: CI result
    if: always()
    needs: [changes, workflows, backend, web, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 ci/gate.py
