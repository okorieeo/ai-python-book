name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Lint the contract
        run: python -m tools.contract_lint contracts/openapi.json
      - name: Block breaking changes against main
        run: |
          git show origin/main:contracts/openapi.json > /tmp/openapi.main.json
          python -m tools.contract_diff /tmp/openapi.main.json contracts/openapi.json
      - name: Every acceptance criterion has a test
        run: python -m tools.trace_check docs/specs/share-conversation.md backend web mobile
      - name: Tool tests
        run: python -m unittest discover -s tools/tests -t .

  backend:
    runs-on: ubuntu-24.04
    needs: contract
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: aichat }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://postgres:ci@localhost:5432/aichat
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.lock.txt -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py test
      - name: The committed contract matches the code
        run: |
          python manage.py spectacular --format openapi-json --file /tmp/generated.json
          python -m tools.contract_diff ../contracts/openapi.json /tmp/generated.json --strict
        working-directory: backend

  web:
    runs-on: ubuntu-24.04
    needs: contract
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: Generated types are up to date
        run: npm run api:types && git diff --exit-code src/lib/api/generated
      - run: npm run lint && npm run typecheck && npm test

  mobile:
    runs-on: ubuntu-24.04
    needs: contract
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run api:types && git diff --exit-code src/lib/generated
      - run: npm run typecheck && npm test -- --ci

  sync:
    runs-on: ubuntu-24.04
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m tools.sync_check contracts/openapi.json web/src mobile/src

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build ./backend
      - run: docker build ./web --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000
