<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr><td align="center">
        <table width="560" cellpadding="0" cellspacing="0" role="presentation"
               style="background:#ffffff;border-radius:8px;padding:32px;">
          <tr><td style="font-size:20px;font-weight:bold;color:#1e3a8a;">
            {{ app_name }}
          </td></tr>
          <tr><td style="padding-top:16px;font-size:16px;line-height:24px;color:#111827;">
            {% block content %}{% endblock %}
          </td></tr>
          <tr><td style="padding-top:24px;font-size:12px;color:#6b7280;">
            You received this email because of activity on your {{ app_name }} account.
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
